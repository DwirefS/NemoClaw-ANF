name: Enterprise Retrieval E2E

on:
  pull_request:
    paths:
      - "enterprise/**"
      - "test/enterprise-*.test.ts"
      - ".github/workflows/enterprise-retrieval-e2e.yaml"
  push:
    branches:
      - main
    paths:
      - "enterprise/**"

permissions:
  contents: read

jobs:
  retrieval-live-postgres:
    name: Retrieval API against live pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_USER: retrieval
          POSTGRES_PASSWORD: retrieval
          POSTGRES_DB: retrieval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retrieval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RETRIEVAL_API_DATABASE_URL: postgres://retrieval:retrieval@127.0.0.1:5432/retrieval
    defaults:
      run:
        working-directory: enterprise/services/retrieval-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install retrieval API dependencies
        run: npm install --no-audit --no-fund
      - name: Bootstrap retrieval schema
        run: npm run bootstrap
      - name: Verify live PostgreSQL contract
        run: npm run verify:postgres
      - name: Run end-to-end local stack validation
        run: npm run e2e:local
      - name: Run console end-to-end validation
        working-directory: enterprise/services/console
        run: npm run e2e:local
      - name: Run secure gateway end-to-end validation
        working-directory: enterprise/services/gateway
        run: npm run e2e:local
      - name: Run MCP bridge end-to-end validation
        working-directory: enterprise/services/mcp-bridge
        run: npm run e2e:local
